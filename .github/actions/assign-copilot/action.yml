name: Assign Copilot
description: >
  Assigns GitHub Copilot's coding agent to an issue or PR. Copilot isn't a
  normal collaborator, so the REST assignees endpoint can't target it --
  it has to be looked up as a "suggested actor" and assigned via GraphQL.
  Best-effort: if GitHub changes this API, the step logs a warning instead
  of failing the run, and the issue/PR is still there for manual handling.

inputs:
  assignable-id:
    description: GraphQL node ID of the issue or PR to assign
    required: true
  fallback-url:
    description: URL to point at in the warning if assignment fails
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ASSIGNABLE_ID: ${{ inputs.assignable-id }}
        FALLBACK_URL: ${{ inputs.fallback-url }}
      run: |
        set -euo pipefail
        owner="${{ github.repository_owner }}"
        repo_name="${{ github.event.repository.name }}"

        copilot_id=$(gh api graphql -f query='
          query($owner:String!, $name:String!) {
            repository(owner:$owner, name:$name) {
              suggestedActors(capabilities: [CAN_BE_ASSIGNED], first: 20) {
                nodes { login ... on Bot { id } ... on User { id } }
              }
            }
          }' -f owner="$owner" -f name="$repo_name" \
          -q '.data.repository.suggestedActors.nodes[] | select(.login | test("copilot"; "i")) | .id' | head -1)

        if [ -z "$copilot_id" ]; then
          echo "::warning::Could not find an assignable Copilot actor on this repo (coding agent may not be enabled) -- assign it manually: $FALLBACK_URL"
          exit 0
        fi

        gh api graphql -f query='
          mutation($assignable:ID!, $actor:ID!) {
            replaceActorsForAssignable(input: {assignableId: $assignable, actorIds: [$actor]}) {
              __typename
            }
          }' -f assignable="$ASSIGNABLE_ID" -f actor="$copilot_id" \
          || echo "::warning::Found Copilot actor id but assignment mutation failed -- assign it manually: $FALLBACK_URL"
